[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Имя файла миграции начинается с даты — в списке версий сразу видно
# хронологию, а не случайный набор хешей.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url здесь намеренно НЕ задан: он приезжает из окружения
# в alembic/env.py. Пароль от базы не должен лежать в репозитории.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
